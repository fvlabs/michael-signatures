<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Slashdev email signatures</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#fff;margin:0;padding:40px 24px 90px;font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#18181b}
.gate{max-width:860px;margin:22px auto 0;display:flex;gap:10px;flex-wrap:wrap}
.gate input{flex:1;min-width:220px;font:inherit;font-size:15px;padding:11px 14px;border:1px solid #d4d4d8;border-radius:8px;outline-color:#215ff6}
.gate button{font:inherit;font-size:15px;font-weight:600;padding:11px 20px;border:0;border-radius:8px;background:#215ff6;color:#fff;cursor:pointer}
.gate button:hover{background:#1a4fd0}
#msg{color:#b91c1c;min-height:20px;margin-top:12px}
h1{font-size:24px;max-width:860px;margin:0 auto 10px}
h2{font-size:19px;max-width:860px;margin:52px auto 0;display:flex;align-items:baseline;gap:10px}
.role{font-size:13px;font-weight:400;color:#71717a}
p{max-width:860px;margin:0 auto 12px;color:#52525b;font-size:13px;line-height:1.6}
.box{max-width:860px;margin:14px auto 0;border:1px dashed #d4d4d8;padding:26px;border-radius:10px}
.dark{background:#0b0d14}
code{background:#f4f4f5;padding:1px 5px;border-radius:4px}
a{color:#215ff6}</style></head>
<body>
<h1>Slashdev email signatures</h1>

<p>Every team member has their own signature page. Type your name (first name is enough) and it opens &mdash; nothing here lists anyone else&rsquo;s card.</p>
<form class="gate" id="f">
  <input id="q" type="text" placeholder="Your name" autocomplete="name" autofocus>
  <button type="submit">Open my signature</button>
</form>
<p id="msg"></p>
<script>
const DIR = {"78e9f7f03334548ede8c9cc5026b0f03fe4a82256282f1a332b96e1b42debcb5":"p/78e9f7f03334548e.html","34550715062af006ac4fab288de67ecb44793c3a05c475227241535f6ef7a81b":"p/78e9f7f03334548e.html","efedd4d9733121333d8aabeee3e341ed56280648e43f4f0fe4172fa1ad1bdf2e":"p/efedd4d973312133.html","85f5e10431f69bc2a14046a13aabaefc660103b6de7a84f75c4b96181d03f0b5":"p/efedd4d973312133.html","953744addbfed374bb870daf0f479fbe4c4e598ea967a854f5545e37f31a919c":"p/953744addbfed374.html","26695e067a0e54513278051839f5f0034d6927069e7eb9da91403137bdeee54e":"p/953744addbfed374.html","f9d00f96241316127aaa0a7095c755d33154f8e54ad5f2086082996fb896a649":"p/f9d00f9624131612.html","af696f52340629746259aa3dd45a5d6e17e918d9f37d0e6a169ce92da0b8f6f4":"p/f9d00f9624131612.html","dad97e9603466aadd662e66c466a8ca37e7406489b8e884d9b8db23f21529385":"p/dad97e9603466aad.html","bd01b0b648c2c64eb1bddd9361d9972ea684b344fedc4d166654a85e8919e7ad":"p/dad97e9603466aad.html","f477947341e737418a7b95824847419b07916bc3bef8d6e898a605fb4e24bf5f":"p/f477947341e73741.html","018e745845d933317ff666d0ba0ba51a5204a2682c6d368789a9e6489f53faa3":"p/f477947341e73741.html","e1ec04f0f90ddd8d8b8190f6139138849e5a66dd557a32fcde80ada0408a2fad":"p/e1ec04f0f90ddd8d.html","ccc68482d9e0eee0789e64c7674421076738f8836857ea89bcd0afb832bf3fc3":"p/e1ec04f0f90ddd8d.html","0fc1a060e2c974aba20e4575cab71f67903f764279747a1583d0ec4ba10cb425":"p/0fc1a060e2c974ab.html","01ad3d5e950a3f1584083ac4c93435dbfd2a39e97e652fa3a59361be3ce79aff":"p/0fc1a060e2c974ab.html","ddb3cd57b83c0e0ecd8d974c628d2f1aadae6d41eb9f24b560de8b603c61a137":"p/ddb3cd57b83c0e0e.html","adafb449e23d0fef21afb8f6a348c40bfc0b12825802ecc1f2233f5ba1e9fd4a":"p/ddb3cd57b83c0e0e.html","4fb084e21f99b682f7fd55346cefd569b07e2e6003bc3f3ad96c4cc8b463a4ec":"p/4fb084e21f99b682.html","03cd7125d00648ea0eccf11c4f52ce7746ab5a26445c17f9c3e4476ef9929a7c":"p/4fb084e21f99b682.html","4aeded28111d1e2ac2798547f54b076f8a1636e06b90006cb4d2580b33a8a3a5":"p/4aeded28111d1e2a.html","2c9a1c95814f31bb8459a7f7fc3536e73 const norm = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b), (x) => x.toString(16).padStart(2, '0')).join('');
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = norm(document.getElementById('q').value);
  if (!q) return;
  const hit = DIR[await sha256(q)];
  if (hit) { location.href = hit; return; }
  document.getElementById('msg').textContent = 'No signature found for that name — check the spelling (first or full name), or ask Kevin to add you.';
});
</script>
