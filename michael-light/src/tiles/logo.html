<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  /* slashdev mark on white with a light streak passing over it every loop.
     No mask needed: on white the streak is only visible where there is ink. */
  html,body{margin:0;padding:0;background:#ffffff}
  html.t-dark,body.t-dark{background:#070a14}
  html.t-none,body.t-none{background:transparent}
  body{width:96px;height:62px;display:grid;place-items:center;overflow:hidden}
  .mark{position:relative;width:92px;height:59px;overflow:hidden}
  .mark img{display:block;width:92px;height:59px}
  /* agnostic: the streak has to stay inside the ink, or on a transparent bake it
     paints white haze over whatever sits behind the GIF. So the highlight is a
     second copy of the mark in a lighter blue, revealed through a diagonal band
     that sweeps across via clip-path — the band can only ever show mark pixels. */
  html.t-agnostic,body.t-agnostic{background:transparent}
  body.t-agnostic .mark{display:none}
  body.t-agnostic .markA{display:block}
  .markA{display:none;position:relative;width:92px;height:59px}
  .markA svg{display:block;width:92px;height:59px}
  .markA .base{color:#215ff6}
  .markA .hi{position:absolute;inset:0;color:#b9d0ff;
    clip-path:polygon(-34% 0,-14% 0,-26% 100%,-46% 100%);
    animation:band 4s ease-in-out infinite}
  @keyframes band{
    0%,42%{clip-path:polygon(-34% 0,-14% 0,-26% 100%,-46% 100%)}
    88%,100%{clip-path:polygon(122% 0,142% 0,130% 100%,110% 100%)}}

  /* black: the original ink, transparent background, white streak — the highlight
     reads exactly as it used to. On a dark surface the letters go to ~1.1:1
     contrast and effectively disappear, leaving the blue slash on its own. */
  html.t-black,body.t-black,html.t-blackout,body.t-blackout{background:transparent}
  /* slidein: the letters hold still (same black ink + hairline as blackout, no
     sweep) and the blue slash slides in along its own slant — down and to the
     left — docking into the word with a slight overshoot, then holding for the
     rest of the loop. Like the icons, each loop restarts with a fresh entrance. */
  html.t-slidein,body.t-slidein{background:transparent}
  body.t-slidein .mark{display:none}
  body.t-slidein .markS{display:block}
  .markS{display:none;position:relative;width:92px;height:59px}
  .markS svg{display:block;width:92px;height:59px}
  .markS .letters path{fill:var(--ink,#09090b);stroke:var(--edge,#eef2ff);stroke-width:6;paint-order:stroke}
  body.e-none .markS .letters path{stroke:none}
  /* the blue highlight, kept from the sweep version: a blue copy of the letters
     revealed through the same diagonal band, timed to run after the slash docks
     (slash enters 0-22% of the loop, band crosses 45-88%) */
  .markS .lettersHi{position:absolute;inset:0;
    clip-path:polygon(-34% 0,-14% 0,-26% 100%,-46% 100%);
    animation:band 4s ease-in-out infinite}
  .markS .lettersHi path{fill:#215ff6}
  .markS .slashS{position:absolute;inset:0}
  .markS .slashS path{fill:#215ff6}
  /* offset direction matches the slash's own slant (dx/dy = 0.68), so the motion
     reads as the stroke slotting into place rather than dropping in */
  .markS .slashS{animation:slidein 4s cubic-bezier(.22,.9,.35,1) infinite}
  @keyframes slidein{
    0%{transform:translate(38px,-56px)}
    14%{transform:translate(-1.6px,2.4px)}
    22%,100%{transform:translate(0,0)}}
  body.t-black .mark,body.t-blackout .mark{display:none}
  body.t-black .markA,body.t-blackout .markA{display:block}
  body.t-black .base,body.t-blackout .base{color:#09090b}
  body.t-black .hi{color:#ffffff}
  /* blackout sweeps brand blue rather than white: a white sweep merges into the
     white outline on a dark surface and the letters read as a blob */
  body.t-blackout .hi{color:#215ff6}
  /* blackout: same black ink with a hairline light outline. Invisible against white,
     but it separates the letters from a dark surface. paint-order keeps the fill on
     top so the stroke only shows outside the glyph.
     :not(:last-of-type) = the d/e/v letters only — the slash is brand blue and
     reads fine on dark unaided, so an outline round it just looks like a sticker.
     stroke-width 10 in a 746-unit viewBox shown at 92px is 1.23px total, so about
     0.6px sits outside the letter. */
  body.t-blackout .markA svg path:not(:last-of-type){stroke:#eef2ff;stroke-width:6;paint-order:stroke}
  /* the slash is brand blue in every variant */
  body.t-black .markA svg path:last-of-type,
  body.t-blackout .markA svg path:last-of-type{color:#215ff6}
  .streak{position:absolute;top:-30%;bottom:-30%;width:26px;left:-40%;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.92),rgba(255,255,255,0));
    transform:skewX(-18deg);animation:sweep 4s ease-in-out infinite}
  @keyframes sweep{0%,45%{left:-40%}88%,100%{left:115%}}
</style></head>

<script>
  var t=(location.search.match(/theme=(\w+)/)||[])[1]||'light';
  if (t!=='light'){document.documentElement.classList.add('t-'+t);document.body.classList.add('t-'+t);}
  if (t==='dark') document.getElementById('mk').src='slashdev-mark-white.svg';
  if (t==='agnostic') document.getElementById('mk').src='slashdev-mark-blue.svg';
  var ink=(location.search.match(/ink=(\w+)/)||[])[1];
  var edge=(location.search.match(/edge=(\w+)/)||[])[1];
  var INKS={black:'#09090b',white:'#ffffff',navy:'#1e2a4a'};
  var EDGES={white:'#eef2ff',grey:'#9aa3b2'};
  if (ink) document.body.style.setProperty('--ink', INKS[ink]);
  if (edge==='none') document.body.classList.add('e-none');
  else if (edge) document.body.style.setProperty('--edge', EDGES[edge]);
</script>
