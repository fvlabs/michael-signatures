<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  /* slashdev mark on white with a light streak passing over it every loop.
     No mask needed: on white the streak is only visible where there is ink. */
  html,body{margin:0;padding:0;background:#ffffff}
  html.t-dark,body.t-dark{background:#070a14}
  html.t-none,body.t-none{background:transparent}
  body{width:96px;height:62px;display:grid;place-items:center;overflow:hidden}
  .mark{position:relative;width:92px;height:59px;overflow:hidden}
  .mark img{display:block;width:92px;height:59px}
  /* agnostic: the streak has to stay inside the ink, or on a transparent bake it
     paints white haze over whatever sits behind the GIF. So the highlight is a
     second copy of the mark in a lighter blue, revealed through a diagonal band
     that sweeps across via clip-path — the band can only ever show mark pixels. */
  html.t-agnostic,body.t-agnostic{background:transparent}
  body.t-agnostic .mark{display:none}
  body.t-agnostic .markA{display:block}
  .markA{display:none;position:relative;width:92px;height:59px}
  .markA svg{display:block;width:92px;height:59px}
  .markA .base{color:#215ff6}
  .markA .hi{position:absolute;inset:0;color:#b9d0ff;
    clip-path:polygon(-34% 0,-14% 0,-26% 100%,-46% 100%);
    animation:band 4s ease-in-out infinite}
  @keyframes band{
    0%,42%{clip-path:polygon(-34% 0,-14% 0,-26% 100%,-46% 100%)}
    88%,100%{clip-path:polygon(122% 0,142% 0,130% 100%,110% 100%)}}
  .streak{position:absolute;top:-30%;bottom:-30%;width:26px;left:-40%;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.92),rgba(255,255,255,0));
    transform:skewX(-18deg);animation:sweep 4s ease-in-out infinite}
  @keyframes sweep{0%,45%{left:-40%}88%,100%{left:115%}}
</style></head>
<body data-period="4000" data-w="96" data-h="62">

<script>
  var t=(location.search.match(/theme=(\w+)/)||[])[1]||'light';
  if (t!=='light'){document.documentElement.classList.add('t-'+t);document.body.classList.add('t-'+t);}
  if (t==='dark') document.getElementById('mk').src='slashdev-mark-white.svg';
  if (t==='agnostic') document.getElementById('mk').src='slashdev-mark-blue.svg';
</script>
