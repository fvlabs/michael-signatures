<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  /* verified tick — same calm 6s loop as the social set: one pop with a glint,
     then it holds. Starts and ends at rest so the GIF loops invisibly. */
  html,body{margin:0;padding:0;background:#ffffff}
  html.t-dark,body.t-dark{background:#070a14}
  html.t-none,body.t-none{background:transparent}
  body{width:16px;height:16px;display:grid;place-items:center;overflow:hidden}
  .disc{position:relative;width:16px;height:16px;border-radius:50%;background:#215ff6;overflow:hidden;
    animation:pop 6s cubic-bezier(.34,1.4,.5,1) infinite;transform-origin:50% 50%}
  @keyframes pop{0%,22%{transform:scale(1)}26%{transform:scale(.92)}31%{transform:scale(1.16)}38%,100%{transform:scale(1)}}
  .tick{position:absolute;inset:0;display:grid;place-items:center}
  svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .glint{position:absolute;top:-40%;bottom:-40%;width:5px;left:-45%;background:rgba(255,255,255,.8);
    filter:blur(1.2px);transform:skewX(-20deg);animation:glint 6s ease-in-out infinite}
  @keyframes glint{0%,26%{left:-45%}44%,100%{left:125%}}
</style></head>
<body data-period="6000" data-w="16" data-h="16">
  <span class="disc"><span class="tick"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></span><span class="glint"></span></span>
<script>
  var t=(location.search.match(/theme=(\w+)/)||[])[1]||'light';
  if (t!=='light'){document.documentElement.classList.add('t-'+t);document.body.classList.add('t-'+t);}
</script>
</body></html>
