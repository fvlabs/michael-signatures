<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  /* verified tick that pops once per loop, with a glint crossing the disc */
  html,body{margin:0;padding:0;background:#ffffff}
  body{width:16px;height:16px;display:grid;place-items:center;overflow:hidden}
  .disc{position:relative;width:16px;height:16px;border-radius:50%;background:#215ff6;overflow:hidden;
    animation:pop 3s ease-in-out infinite;transform-origin:50% 50%}
  @keyframes pop{0%,62%,100%{transform:scale(1)}70%{transform:scale(1.18)}80%{transform:scale(1)}}
  .tick{position:absolute;inset:0;display:grid;place-items:center}
  svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .glint{position:absolute;top:-40%;bottom:-40%;width:6px;left:-40%;background:rgba(255,255,255,.75);
    filter:blur(1.5px);transform:skewX(-20deg);animation:glint 3s ease-in-out infinite}
  @keyframes glint{0%,60%{left:-40%}86%,100%{left:120%}}
</style></head>
<body data-period="3000" data-w="16" data-h="16">
  <span class="disc"><span class="tick"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></span><span class="glint"></span></span>
</body></html>
