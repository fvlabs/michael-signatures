<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  /* 24px social glyph on white. One shared 3s period; each icon moves in its own
     slice of that period, so the stacked column ripples top-to-bottom in email. */
  html,body{margin:0;padding:0;background:#ffffff}
  body{width:24px;height:24px;display:grid;place-items:center;overflow:hidden}
  svg{width:22px;height:22px;display:block}
  #web svg{fill:none;stroke:#215ff6;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  #web{animation:s1 3s ease-in-out infinite;transform-origin:50% 50%}
  #linkedin{animation:s2 3s ease-in-out infinite;transform-origin:50% 50%}
  #x{animation:s3 3s ease-in-out infinite;transform-origin:50% 50%}
  #github{animation:s4 3s ease-in-out infinite;transform-origin:50% 50%}
  @keyframes s1{0%,100%{transform:scale(1) rotate(0)}5%{transform:scale(1.16) rotate(-8deg)}12%{transform:scale(1) rotate(0)}}
  @keyframes s2{0%,20%,100%{transform:translateY(0)}25%{transform:translateY(-3px)}32%{transform:translateY(0)}}
  @keyframes s3{0%,40%,100%{transform:scale(1)}45%{transform:scale(1.2)}52%{transform:scale(1)}}
  @keyframes s4{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-12deg)}70%{transform:rotate(10deg)}78%{transform:rotate(0)}}
</style></head>

<script>
