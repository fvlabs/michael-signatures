<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  /* One cohesive monochrome set: solid glyphs of matched ink mass in a single
     color, the way the reference set reads on a white card. Motion is
     deliberately sparse — one 6s loop, each icon lifting and settling in its
     own slice of it, so a stacked column cascades once and then holds still.
     Each lift also warms from ink to slashdev blue and back.

     ?icon=<glyph>&slot=<1-4> — the slot picks the position in that cascade,
     so the same glyph can be reused at a different place in a different set. */
  html,body{margin:0;padding:0;background:#ffffff}
  body{width:24px;height:24px;display:grid;place-items:center;overflow:hidden;color:#18181b}
  svg{width:23px;height:23px;display:block;overflow:visible}
  span{display:grid;place-items:center;transform-origin:50% 60%}
  .cut{stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round}

  .s1{animation:lift1 6s cubic-bezier(.34,1.4,.5,1) infinite,tint1 6s ease-in-out infinite}
  .s2{animation:lift2 6s cubic-bezier(.34,1.4,.5,1) infinite,tint2 6s ease-in-out infinite}
  .s3{animation:lift3 6s cubic-bezier(.34,1.4,.5,1) infinite,tint3 6s ease-in-out infinite}
  .s4{animation:lift4 6s cubic-bezier(.34,1.4,.5,1) infinite,tint4 6s ease-in-out infinite}

  /* rest -> compress -> lift with overshoot -> rest. Starts and ends at rest, so
     the baked GIF closes its loop with no visible jump. */
  @keyframes lift1{0%,2%{transform:translateY(0) scale(1)}5%{transform:translateY(1px) scale(.9)}
    10%{transform:translateY(-3px) scale(1.1)}16%,100%{transform:translateY(0) scale(1)}}
  @keyframes lift2{0%,7%{transform:translateY(0) scale(1)}10%{transform:translateY(1px) scale(.9)}
    15%{transform:translateY(-3px) scale(1.1)}21%,100%{transform:translateY(0) scale(1)}}
  @keyframes lift3{0%,12%{transform:translateY(0) scale(1)}15%{transform:translateY(1px) scale(.9)}
    20%{transform:translateY(-3px) scale(1.1)}26%,100%{transform:translateY(0) scale(1)}}
  @keyframes lift4{0%,17%{transform:translateY(0) scale(1)}20%{transform:translateY(1px) scale(.9)}
    25%{transform:translateY(-3px) scale(1.1)}31%,100%{transform:translateY(0) scale(1)}}

  @keyframes tint1{0%,3%{color:#18181b}10%{color:#215ff6}20%,100%{color:#18181b}}
  @keyframes tint2{0%,8%{color:#18181b}15%{color:#215ff6}25%,100%{color:#18181b}}
  @keyframes tint3{0%,13%{color:#18181b}20%{color:#215ff6}30%,100%{color:#18181b}}
  @keyframes tint4{0%,18%{color:#18181b}25%{color:#215ff6}35%,100%{color:#18181b}}
</style></head>
<body data-period="6000" data-w="24" data-h="24">

<!-- solid globe: filled disc with the meridian/latitudes knocked out in white -->
<span id="web"><svg viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="10.6" fill="currentColor"/>
  <path class="cut" d="M1.6 12h20.8"/>
  <path class="cut" d="M3.6 7.2h16.8"/>
  <path class="cut" d="M3.6 16.8h16.8"/>
  <path class="cut" d="M12 1.5c3.1 2.9 4.6 6.6 4.6 10.5S15.1 19.6 12 22.5c-3.1-2.9-4.6-6.6-4.6-10.5S8.9 4.4 12 1.5z"/>
</svg></span>

<span id="linkedin"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.86-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 110-4.13 2.06 2.06 0 010 4.13zm1.78 13.02H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg></span>

<!-- X and Instagram sit in solid tiles so their ink weight matches the others -->
<span id="x"><svg viewBox="0 0 24 24">
  <rect x=".8" y=".8" width="22.4" height="22.4" rx="5.2" fill="currentColor"/>
  <g transform="translate(4.9 4.9) scale(.593)"><path fill="#fff" d="M18.9 1.15h4.02l-8.78 10.03L24 22.85h-8.09l-6.33-8.28-7.25 8.28H.31l9.4-10.74L0 1.15h8.3l5.72 7.57 4.88-7.57zm-1.41 19.28h2.23L6.62 3.44H4.23l13.26 16.99z"/></g>
</svg></span>

<span id="instagram"><svg viewBox="0 0 24 24">
  <rect x=".8" y=".8" width="22.4" height="22.4" rx="6" fill="currentColor"/>
  <rect class="cut" x="5.4" y="5.4" width="13.2" height="13.2" rx="4.2"/>
  <circle class="cut" cx="12" cy="12" r="3.4"/>
  <circle cx="16.6" cy="7.5" r="1.15" fill="#fff"/>
</svg></span>

<span id="github"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 .3a12 12 0 00-3.8 23.4c.6.1.82-.26.82-.58l-.02-2.04c-3.34.73-4.04-1.6-4.04-1.6-.55-1.4-1.34-1.78-1.34-1.78-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.94 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.11-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 016 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.63-5.48 5.93.43.36.82 1.1.82 2.22l-.02 3.29c0 .32.22.69.83.57A12 12 0 0012 .3z"/></svg></span>

<span id="facebook"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M9.1 23.69v-7.98H6.63v-3.67H9.1v-1.58c0-4.08 1.85-5.98 5.86-5.98.4 0 .96.04 1.47.1.51.07.95.15 1.14.2v3.32a8.62 8.62 0 00-.65-.03 26.8 26.8 0 00-.74-.01c-.7 0-1.25.1-1.67.31a1.69 1.69 0 00-.68.62c-.26.42-.37 1-.37 1.75v1.3h3.92l-.39 2.1-.29 1.57h-3.24v8.24C19.4 23.24 24 18.18 24 12.04 24 5.42 18.63.04 12 .04S0 5.42 0 12.04c0 5.63 3.87 10.35 9.1 11.65z"/></svg></span>

<script>
  var q = location.search;
  var which = (q.match(/icon=(\w+)/) || [])[1] || 'web';
  var slot  = (q.match(/slot=(\d)/) || [])[1] || '1';
  ['web','linkedin','x','github','instagram','facebook'].forEach(function (k) {
    var el = document.getElementById(k);
    if (k === which) { el.style.display = 'grid'; el.className = 's' + slot; }
    else el.style.display = 'none';
  });
</script>
</body></html>
