<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  /* circular portrait on white with a rotating brand-gradient ring.
     The photo carries a white border, so only a thin arc of the ring shows. */
  html,body{margin:0;padding:0;background:#ffffff}
  body{width:132px;height:132px;display:grid;place-items:center;overflow:hidden}
  .photo{width:132px;height:132px;position:relative;display:grid;place-items:center}
  .ring{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,#215ff6,#7b61ff,#00d1ff,rgba(33,95,246,.10) 62%,#215ff6);
    animation:rot 2.5s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  img{position:relative;width:124px;height:124px;border-radius:50%;object-fit:cover;border:4px solid #fff}
</style></head>
<body data-period="2500" data-w="132" data-h="132">
  <div class="photo"><span class="ring"></span><img src="michael.png" alt=""></div>
</body></html>
