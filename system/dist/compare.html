<!DOCTYPE html><html><head><meta charset="UTF-8"><title>PNG vs GIF</title>
<style>body{background:#e9eef3;font-family:Arial,sans-serif;margin:0;padding:40px}
.col{max-width:640px;margin:0 auto 36px}.col h3{color:#333;margin:0 0 4px}.col p{color:#777;font-size:12px;margin:0 0 12px}
img{width:100%;max-width:600px;display:block;border-radius:8px;box-shadow:0 2px 14px rgba(0,0,0,.08)}</style></head>
<body>
<div class="col"><h3>PNG (estático, qualidade real) — 606 KB</h3><p>Sem banding. Vai como imagem do e-mail; animação fica no link "live".</p><img src="michael/card.png"></div>
<div class="col"><h3>GIF (animado, 256 cores) — 1.4 MB</h3><p>Tem movimento, mas banding no degradê.</p><img src="michael/card.gif"></div>
</body></html>
