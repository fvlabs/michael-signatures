<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:#070a14}
  body{width:140px;height:140px;display:grid;place-items:center;overflow:hidden;perspective:800px}
  .photo{width:128px;height:128px;position:relative;display:grid;place-items:center;transform-style:preserve-3d;animation:flip 3.6s ease-in-out infinite}
  @keyframes flip{0%,32%{transform:rotateY(0)}64%{transform:rotateY(360deg)}100%{transform:rotateY(360deg)}}
  .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#215ff6,#7b61ff,#00d1ff,#215ff6);box-shadow:0 0 34px rgba(33,95,246,.45)}
  .photo img{position:relative;width:114px;height:114px;border-radius:50%;object-fit:cover;border:3px solid #070a14}
</style></head>
<body>
  <div class="photo"><span class="ring"></span><img src="../assets/PHOTO" alt=""></div>
</body></html>
