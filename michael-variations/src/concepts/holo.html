<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  html,body{margin:0;padding:0;background:#070a14}
  body{width:140px;height:140px;display:grid;place-items:center;overflow:hidden}
  .wrap{width:124px;height:124px;position:relative;border-radius:50%;overflow:hidden;border:2px solid rgba(103,232,249,.5);box-shadow:0 0 22px rgba(34,211,238,.25)}
  img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.7) brightness(1.02)}
  .tint{position:absolute;inset:0;background:rgba(34,211,238,.12);mix-blend-mode:screen}
  .scan{position:absolute;left:0;width:100%;height:34px;
    background:linear-gradient(180deg,transparent,rgba(103,232,249,.55) 50%,transparent);
    animation:sweep 3s linear infinite}
  @keyframes sweep{0%{top:-40px}100%{top:130px}}
  .lines{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(103,232,249,.10) 0 1px,transparent 1px 4px)}
  .flick{position:absolute;inset:0;background:rgba(103,232,249,.16);mix-blend-mode:screen;animation:fl 3s steps(1) infinite}
  @keyframes fl{0%,88%{opacity:0}90%{opacity:1}92%{opacity:0}95%{opacity:.7}97%,100%{opacity:0}}
</style></head>
<body data-period="3000" data-w="140" data-h="140">
  <div class="wrap"><img src="michael.png" alt=""><span class="tint"></span><span class="lines"></span><span class="scan"></span><span class="flick"></span></div>
</body></html>
