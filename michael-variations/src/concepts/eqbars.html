<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  html,body{margin:0;padding:0;background:#070a14}
  body{width:40px;height:30px;display:flex;align-items:flex-end;justify-content:center;gap:3px;overflow:hidden;padding-bottom:2px;box-sizing:border-box}
  i{display:block;width:4px;height:24px;border-radius:2px;background:linear-gradient(180deg,#22d3ee,#215ff6);transform-origin:50% 100%;animation:eq 1.6s ease-in-out infinite}
  i:nth-child(1){animation-delay:0s}
  i:nth-child(2){animation-delay:-.4s}
  i:nth-child(3){animation-delay:-.8s}
  i:nth-child(4){animation-delay:-1.2s}
  i:nth-child(5){animation-delay:-.6s}
  @keyframes eq{0%,100%{transform:scaleY(.28)}25%{transform:scaleY(1)}50%{transform:scaleY(.45)}75%{transform:scaleY(.8)}}
</style></head>
<body data-period="1600" data-w="40" data-h="30">
  <i></i><i></i><i></i><i></i><i></i>
</body></html>
