<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  html,body{margin:0;padding:0;background:#070a14}
  body{width:560px;height:308px;position:relative;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  .card{position:absolute;inset:0;padding:36px 38px;box-sizing:border-box;display:flex;gap:30px;align-items:center}
  .avatar{width:132px;height:132px;flex:0 0 auto;position:relative;display:grid;place-items:center}
  .avatar .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#215ff6,#7b61ff,#00d1ff,#215ff6);box-shadow:0 0 26px rgba(33,95,246,.40)}
  .avatar img{position:relative;width:116px;height:116px;border-radius:50%;object-fit:cover;border:4px solid #070a14;display:block}
  .info{display:flex;flex-direction:column}
  .name{font-size:26px;font-weight:bold;color:#fff;line-height:1.1}
  .role{margin-top:7px;font-size:11px;font-weight:bold;letter-spacing:3px;color:#5b8bff}
  .rule{margin:15px 0 14px;width:230px;height:1px;background:#215ff6}
  .row{display:flex;align-items:center;gap:11px;margin-bottom:9px;color:#c3cbdc;font-size:14px}
  .row.em{color:#fff;font-weight:bold}
  .row svg{width:19px;height:19px;stroke:#5b8bff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .brand{display:flex;align-items:center;gap:10px;margin-top:8px}
  .brand img{width:62px;display:block}
  .brand span{color:#727b91;font-size:13px}
  .beam{position:absolute;top:-40%;left:0;width:36%;height:180%;z-index:3;pointer-events:none;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.16),rgba(91,139,255,.28),transparent);
    transform:skewX(-18deg);filter:blur(6px);animation:sweep 3.6s ease-in-out infinite}
  @keyframes sweep{0%{left:-45%;opacity:0}6%{opacity:1}40%{opacity:1}48%,100%{left:125%;opacity:0}}
</style></head>

</body></html>
