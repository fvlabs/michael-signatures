<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  html,body{margin:0;padding:0;background:#070a14}
  body{width:520px;height:56px;position:relative;overflow:hidden}
  i{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
  i.b{background:#5b8bff}i.c{background:#67e8f9}
  @keyframes tw{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}
  .glow{position:absolute;left:-60px;top:-70px;width:340px;height:150px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(33,95,246,.28),transparent);animation:drift 3s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(46px)}}
</style></head>
<body data-period="3000" data-w="520" data-h="56">
