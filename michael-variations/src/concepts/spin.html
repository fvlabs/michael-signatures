<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  html,body{margin:0;padding:0;background:#070a14}
  body{width:140px;height:140px;display:grid;place-items:center;overflow:hidden}
  .photo{width:128px;height:128px;position:relative;display:grid;place-items:center}
  .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#215ff6,#7b61ff,#00d1ff,rgba(33,95,246,.15),#215ff6);
    box-shadow:0 0 30px rgba(33,95,246,.40);animation:rot 2.5s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  img{position:relative;width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid #070a14}
</style></head>
<body data-period="2500" data-w="140" data-h="140">
  <div class="photo"><span class="ring"></span><img src="michael.png" alt=""></div>
</body></html>
