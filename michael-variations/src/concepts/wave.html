<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  html,body{margin:0;padding:0;background:#070a14}
  body{width:36px;height:36px;display:grid;place-items:center;overflow:hidden}
  .hand{font-size:26px;line-height:1;transform-origin:70% 75%;animation:wave 2s ease-in-out infinite}
  @keyframes wave{0%,50%,100%{transform:rotate(0)}56%{transform:rotate(16deg)}64%{transform:rotate(-9deg)}72%{transform:rotate(14deg)}80%{transform:rotate(-5deg)}88%{transform:rotate(0)}}
</style></head>
<body data-period="2000" data-w="36" data-h="36">
  <span class="hand">👋</span>
</body></html>
